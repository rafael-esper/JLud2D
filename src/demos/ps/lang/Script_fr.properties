Title_Credits_About_1 = Ceci est un remake du Phantasy Star original, sorti sur Sega Master System en 1986.
Title_Credits_About_2 = Il comprend de nombreuses nouveautés : une meilleure interface, des personnages équilibrés, le déplacement en diagonale, un nouveau système de niveaux...
Title_Credits_About_3 = ... un script retraduit depuis la version japonaise, de nouvelles quêtes, de nouveaux monstres, objets, statistiques et sorts, des combats améliorés...
Title_Credits_About_4 = ... et des améliorations dans chaque aspect du jeu. Il contient aussi des scénarios alternatifs pour d'autres personnages et un nouveau mini-jeu nommé PS Arena...
Title_Credits_About_5 = ... Une version étendue est prévue pour bientôt.

