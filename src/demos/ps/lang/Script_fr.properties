Dark_Castle_Lassic = Ah, c'est vous. Je me doutais que vous viendriez. Je sais beaucoup de choses sur vous, mon enfant. Je sais que vous aimiez tendrement votre frère. Nero, c'est cela? Oui. J'en sais davantage. Je connais aussi votre nom. Votre vrai nom. Enfant insensée. Vous ne connaissez même pas votre propre lignée. Vous n'avez aucune idée de ce qui est en vous. Et je sais aussi pourquoi vous êtes ici. Vous comptez me tuer. N'est-ce pas, mon enfant?
Dark_Castle_LassicYes = Oui, bien sûr. Votre courage est admirable. Vous ressemblez beaucoup à votre père. Je ne prendrai guère de plaisir à vous tuer.
Dark_Castle_LassicNo = Je vous en prie. Je n'ai pas de temps pour les jeux. Venez, finissons-en.
Dark_Castle_LassicVictory = Le seigneur LaShiec est tombé. Le dernier voeu de Nero a été exaucé. C'est le début d'une nouvelle vie pour Algol. Il ne reste plus qu'à prévenir le Gouverneur, à Paseo.


# Cinematic Display: Ending
Cinematic_Ending_1 = Avec le temps, le ciel s'éclaircit. Les créatures disparurent. Il ne reste plus au-dessus de Baya Marlay qu'une brise douce et fraîche. Le peuple reconnaissant d'Algol ramassa les morceaux et repartit de zéro.
Cinematic_Ending_2 = Alisa
Cinematic_Ending_3 = Tylon
Cinematic_Ending_4 = Lutz
Cinematic_Ending_5 = et Myau
Cinematic_Ending_6 = Même si les souvenirs de cette sombre époque s'estomperont, ces quatre noms resteront à jamais dans le coeur du peuple d'Algol.


