Monster_Dialogue_1 = Nous voulons devenir amis avec les Palmiens.
Monster_Dialogue_2 = Je mangerais bien quelques baies Laerma, là!
Monster_Dialogue_3 = Vous ne devriez pas vous opposer au seigneur LaShiec.
Monster_Dialogue_4 = Oh! Alors vous comprenez notre langue?
Monster_Dialogue_5 = Youpi!
Monster_Dialogue_6 = Dans les donjons, méfiez-vous des trappes.
Monster_Dialogue_7 = On se blesse à ouvrir les coffres sans précaution.
Monster_Dialogue_8 = Sales voleurs!
Monster_Dialogue_9 = Les gens nous détestent, quoi qu'on fasse.
Monster_Tele_1 = La flûte apaisante a un son si agréable!
Monster_Tele_2 = Les IceDeckers peuvent trancher la glace!
Monster_Tele_3 = Le seigneur LaShiec vit là-haut dans le ciel.
Monster_Tele_4 = Le docteur fou d'Avion possède un pot laconien.
Monster_Tele_5 = Il y a des endroits dans le ciel que même un vaisseau spatial ne peut atteindre.
Monster_Tele_6 = Il faut posséder un certain objet pour faire pousser les baies Laerma.
Monster_Tele_7 = Certains labyrinthes de donjon contiennent des portes cachées.
Monster_Tele_8 = La clef miracle peut ouvrir les portes magiques!
Monster_Tele_9 = Certains Dézoriens sont des menteurs, alors prudence.
Monster_Tele_10 = Eh bien, vous êtes courageux de me parler. Tenez bon.


