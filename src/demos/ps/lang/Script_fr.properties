# Start as Odin

Cinematic_Intro_Odin_1 = Palma, première planète du système stellaire d'Algol, a atteint le sommet de sa prospérité sous son roi, LaShiec. Cependant, au printemps de cette année, d'horribles rumeurs ont commencé à se répandre.
Cinematic_Intro_Odin_2 = Le roi LaShiec aurait été envoûté par une étrange religion et aurait vendu Algol en échange de la vie éternelle.
Cinematic_Intro_Odin_3 = Les rumeurs se sont révélées vraies. Des créatures grotesques se sont répandues dans chaque recoin de chaque planète d'Algol, menaçant la vie de ses habitants. Quelque chose d'effroyable se prépare...
Cinematic_Intro_Odin_4 = Vous êtes Tylon, le guerrier. Vous êtes parti en mission pour renverser LaShiec.

Camineet_House_Alis_Odin = Mon grand frère travaille au port spatial. Mais je crois qu'il me cache quelque chose.
Camineet_House_Nekise_Odin = Avec un pistolet, on peut toucher plusieurs ennemis à la fois.
Camineet_House_Suelo_Odin = Les temps sont durs. Si tu es blessé au combat, va dans un hôpital à Parolit ou à Shion.

Eppi_House_Key_Myau = Tylon, mon garçon. Tu vas avoir besoin d'aide si tu comptes nous sauver de LaShiec. J'ai ici une créature prête à se joindre à ta quête.

Cinematic_Myau_Odin1 = Je m'appelle Myau. Ravi de te rencontrer.
Cinematic_Myau_Odin2 = LaShiec mène notre monde à sa perte. Nous devons l'arrêter.
Cinematic_Myau_Odin3 = Il est fort, et la rumeur dit qu'il a des pouvoirs magiques. Comment le défier?
Cinematic_Myau_Odin4 = J'ai entendu dire que Medusa possède une hache mystique. Avec cette arme, j'aurais peut-être une chance contre LaShiec. Cherchons-la ensemble.

Odin_Cave_Hiss = Vous avez entendu un sifflement résonner dans la grotte. C'est peut-être Medusa?
Odin_Cave_Compass = Myau, la boussole fait un bruit étrange. Je vais la cacher ici pour attirer Medusa.
Odin_Cave_Medusa = C'est Medusa!
Odin_Cave_Stone = Tylon est changé en pierre. Myau s'échappe.
Odin_Cave_Alis_Help = Le temps passe... Un long, très long moment, qui semble une éternité à Tylon... Soudain, une jeune fille apparaît, accompagnée de Myau.

# Start as Noah
Name_Tajim = Tajima
Name_Brio = Brio

Noah_Tajim_Intro = Le roi LaShiec mène notre monde vers une crise sans précédent. Un de ses sbires, le Mage bleu, tourmente le peuple motavien. On peut le trouver dans la grotte de Maharu, au nord de Paseo.
Noah_Tajim_Mission = Lutz, mon élève, dans le cadre de ta formation, tu dois vaincre le Mage bleu. Prépare-toi, et quand tu seras prêt, rends-toi à la grotte et arrête-le. Je te donne une clef de donjon, elle pourra t'être utile dans ta quête.

Noah_Paseo_Shop_Shortcake = Je vends des gâteaux à 280 mesetas. Vous en voulez un?
Noah_Paseo_Shop_ShortcakeNo = Bon, revenez quand vous voulez.
Noah_Paseo_Shop_ShortcakeYes = Merci! Revenez!

Noah_Paseo_Governor_Intro = Bienvenue dans mon bureau. C'est toujours un plaisir de recevoir quelqu'un d'aussi distingué.
Noah_Paseo_Governor_Quest = Le Mage bleu nous cause des ennuis. Plusieurs clans motaviens se battent entre eux à cause de son influence. Je vais écrire une lettre attestant que ta quête a mon plein soutien.
Noah_Paseo_Governor_Return = Il n'y a pas un instant à perdre. Sois prudent. Je prie pour ta sécurité.

Noah_Motavia_Brio_Halt = Halte! Personne ne passe, nous tenons ce blocus jour et nuit. Vous ne pouvez pas pénétrer sur le territoire du Mage bleu.
Noah_Motavia_Brio_Letter = Vous avez une lettre du Gouverneur? Montrez-moi ça. Je vois, vous comptez vaincre le Mage bleu et défaire tout le mal qu'il a répandu.
Noah_Motavia_Brio_Join = Je crois que je devrais vous laisser passer. Mieux encore, je veux me joindre à votre cause et vous aider. Je m'appelle Brio, et je connais le chemin de la grotte de Maharu. Allons-y!

Noah_Blue_Wizard_with_Lutz = Un Esper... Vous osez me défier? Vous allez le regretter.
Noah_Blue_Wizard_without_Lutz = Qui êtes-vous? Partez, vous n'avez rien à faire ici.

Noah_Ending_Peace = Le Mage bleu a été vaincu. Les clans motaviens sont maintenant en paix. Mais sous le règne du roi LaShiec, combien de temps cela durera-t-il?
Noah_Ending_Training = C'est un bon endroit pour poursuivre mon entraînement. Mon pouvoir doit grandir pour affronter les épreuves à venir.


# Tonoe
Tonoe_House_1 = J'ai entendu dire qu'il y a des villes pleines de ferraille sur Palma. C'est vrai?
Tonoe_House_1Yes = Bartevo? J'aimerais bien y aller un jour.
Tonoe_House_1No = J'aime vraiment la ferraille.
Tonoe_House_2 = Maître Tajima vit dans une grotte près du lac. Mais elle abrite des monstres magiques, alors soyez prudents.
Tonoe_House_3 = Ma fille a disparu! Aidez-moi à la retrouver, je vous en prie. Elle a été vue pour la dernière fois près de la grotte à l'est d'ici.
Tonoe_House_3_Rescue = Merci beaucoup d'avoir retrouvé ma fille! Vous pouvez vous reposer chez moi quand vous voulez.
Tonoe_House_4 = La grotte à l'est s'appelle la mine Blueberry. Nous y extrayions du titane, mais elle est maintenant pleine de monstres.
Tonoe_House_5 = Nous vendons de l'Alsuline à la boutique. Certains monstres d'Algol peuvent pétrifier leurs victimes, comme les basilics. Avec ce médicament, vous pouvez les ramener à la normale.
Tonoe_House_Chief = Je suis Fryz, le chef de ce village. Il y a cinq clans de Motaviens sur la planète. Mais Tonoe est une ville très cosmopolite, qui accueille tous les clans à égalité. Nous accueillons même les Palmiens, sauf votre scélérat de roi.
Tonoe_People_Ent1 = Voici le village motavien de Tonoe.
Tonoe_People_Ent2 = Les Motaviens aiment vivre dans des villes secrètes, loin des regards.
Tonoe_People_Ent3 = Des bandits motaviens rôdent dans le désert. Les temps sont durs.
Tonoe_People_Rescue = Merci de m'avoir sauvée! Je rentre à la maison.
Tonoe_Mines_Necro_Esper = Nous, les nécromanciens, étudions les morts-vivants. Vous devriez rendre visite à mon maître, il se cache dans une maison en ruine à Gothic.

# Gothic: new
Gothic_Necro_Palman = Je suis un nécromancien. Cherchez-vous à mettre fin à la malédiction des morts-vivants sur Algol?
Gothic_Necro_Palman_Yes = Bientôt, nous pourrons y travailler ensemble. Patience.
Gothic_Necro_Palman_No = Un jour, quelqu'un aura le courage de s'y atteler.

