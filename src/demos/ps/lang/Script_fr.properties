# Cinematic Display: Intro
Cinematic_Intro_1 = Ordure! Ne fouine pas dans les affaires de Lassic!
Cinematic_Intro_2 = C'est compris?!
Cinematic_Intro_3 = Nero! Que s'est il passé?! Ne meurt pas!
Cinematic_Intro_4 = Alis, ecoute! Lassic entraine notre monde a sa destruction... J'ai tenté de decouvrir ses plans... Mais seul je n'ai rien pu faire...
Cinematic_Intro_5 = J'ai entendu parler d'un puissant guerrier nomme Odin... Ensemble... Vous pourriez arreter Lassic... Alis... Il est trop tard pour moi... Soit forte...
Cinematic_Intro_6 = Il ne faut pas que mon frère ait donné sa vie pour rien! Veille sur moi, Nero!

# Camineet
Camineet_House_Alis = Voici la maison d'Alis.
Camineet_House_Nekise_intro = Je suis Nekise. On raconte pas mal de choses ici, mais certains racontent qu'un guerrier nommé Odin vit dans la ville de Scion. Je possede aussi un pot laconien que je tiens de Nero. Ceci t'aidera dans ta quete. J'aimerai d'être plus utile.
Camineet_House_Nekise_greet = Je prie pour ton salut.
Camineet_House_Man = Il te faut la clef du donjon pour ouvrir les portes fermées.
Camineet_House_Suelo_intro1 = Je suis Suelo.
Camineet_House_Suelo_intro2 = Je sais combien cela est penible, et personne ne pourra t'empecher d'accomplir ce que tu dois faire.
Camineet_House_Suelo_intro3 = Si tu es blessé lors d'un combat, viens ici te reposer.
Camineet_House_Suelo_greet = Repose-toi. Tu sera toujours la bienvenue.
Camineet_House_Oldman = Connais-tu les planêtes du systeme solaire d'Algol?
Camineet_House_Oldman_Yes = OK. Bonne journée.
Camineet_House_Oldman_No = Il y en a trois: Palma, Motavia et Dezolis. Palma est verdoyante. Motavia est faite de sable. Dezolis est faite de glace.
Camineet_House_Oldman_NoCrisis = Le systeme d'Algol fait face a une terrible crise.
Camineet_People_Ent1 = Dans certains donjons, tu n'ira pas loin sans lumière.
Camineet_People_Ent2 = Il y a un port spatial a l'ouest de Camineet.
Camineet_People_Ent3 = Si tu veux faire des affaires, vas donc au port.
Camineet_People_Ent4 = La zone residentielle Camineet est sous loi martiale.
Camineet_People_Cop1 = Si tu tiens a la vie, mieux vaut rester ici.
Camineet_People_Cop2 = Mieux vaut ne pas quitter la zone residentielle.
Camineet_People_Cop_No_Pass = On ne passe pas sans badge.
Camineet_People_Cop_Pass = Vous pouvez passez.

# Parolit
Parolit_House_1 = Voici la zone residentielle Parolit.
Parolit_House_2 = La fôret est dangereuse.
Parolit_House_3 = Medusa a ressucité et vit dans une caverne au sud. Un seul regard te changerai en pierre.
Parolit_People_Ent1 = Du port spatial, on peut rejoindre Paseo sur Motavia.
Parolit_People_Ent2 = Il y a un passage sous-terrain pour la fôret Gothique quelque part a l'ouest de Parolit.
Parolit_People_Ent3 = A l'est se trouve le port de Scion.
Parolit_People_Cop1 = Si tu tiens a la vie, mieux vaut rester ici.
Parolit_People_Cop2 = Mieux vaut ne pas quitter la zone residentielle.
Parolit_People_Cop_No_Pass = On ne passe pas sans badge.
Parolit_People_Cop_Pass = Vous pouvez passez.

# Scion
Scion_House_1 = En allant vers le nord, vous trouverez une butte appelée Baya Marlay, mais vous ne pourrez pas y accéder.
Scion_House_2 = Le seul moyen d'ouvrir une porte scellée par la magie est de lancer soi-même un sort.
Scion_House_3 = Il y a des êtres intelligents sur Motavia et Dezoris. De la vie sur une autre planète! Vous imaginez?
Scion_House_4_PreMyau = Oui, Tylon est passé ici. Il parlait d'aller au sud, pour tuer Medusa. Il avait avec lui un étrange animal qui parle! Il portait un flacon de médicament autour du cou. Je me demande ce que c'était.
Scion_House_4_AfterMyau = Il était temps que quelqu'un s'attaque à LaShiec. Que Dieu vous garde.
Scion_House_5 = Il faudrait être fou pour entrer dans la forêt d'Eppi sans boussole.
Scion_House_6_PreMyau = Ça va vous sembler fou, mais j'ai trouvé un animal parlant qui errait dans le donjon de Medusa. Je l'ai vendu à un marchand de Paseo. Ce petit gars valait une fortune!
Scion_House_6_AfterMyau = L'économie s'est effondrée depuis que LaShiec est au pouvoir. Je suis tellement fauché que je ne sais plus quoi faire...
Scion_House_7 = La grotte d'Iala se trouve sur la péninsule au sud de la ville.
Scion_People_Ent1 = Bienvenue à Shion. Le commerce était florissant ici, avant l'embargo de LaShiec. Maintenant, la plupart d'entre nous cherchent désespérément du travail.
Scion_People_Ent2 = Avant, j'explorais la grotte de Naula, sur la côte au nord de Baya Marlay. Mais avec tous ces monstres qui apparaissent, je n'essaierais même plus d'y aller.
Scion_Second_Hand_Shop_Secret1 = Je ne vois pas de quoi vous parlez. Je tiens un commerce honnête ici.
Scion_Second_Hand_Shop_Secret2 = Je vous l'ai déjà dit : je ne vends pas de marchandise illégale. Sortez de ma boutique.
Scion_Second_Hand_Shop_Secret3 = Vous n'abandonnez jamais, hein? Tenez, prenez. Un laissez-passer, signé et certifié. Si on vous parle de deux coursiers morts, vous ne savez rien.

# Spaceport
Spaceport_People_Ent1 = Bienvenue au port spatial de Palma. D'ici, vous pouvez voyager vers Paseo, sur Motavia.
Spaceport_People_Ent2 = Ces vaisseaux partent pour Paseo, la capitale de Motavia. C'est là que vit le Gouverneur.
Spaceport_People_Ent3 = Avant la commercialisation des voyages spatiaux, les vaisseaux étaient construits dans un laboratoire de recherche à Gothic.
Spaceport_People_Cop = Avez-vous un passeport?
Spaceport_People_Cop_YesLie = Ne vous moquez pas de moi!
Spaceport_People_Cop_Yes = Vous pouvez passer.
Spaceport_People_Cop_No = Vous ne pouvez pas passer.
Spaceport_Passport_Intro = Vous venez demander un passeport?
Spaceport_Passport_No = Très bien. Au suivant, je vous prie!
Spaceport_Passport_Yes = La loi m'oblige à vous poser quelques questions. Avez-vous déjà été condamné pour un crime?
Spaceport_Passport_IllegalYes = Désolé, vous n'êtes pas admissible. Au suivant!
Spaceport_Passport_IllegalNo = Souffrez-vous d'une maladie qui pourrait s'aggraver en voyage?
Spaceport_Passport_IllnessNo = Il y a des frais de dossier de 100 mesetas. Pouvez-vous payer?
Spaceport_Passport_IllnessYes = Désolé, vous n'êtes pas admissible. Au suivant!
Spaceport_Passport_PayNo = Très bien. Au suivant, je vous prie!
Spaceport_Passport_PayYes = Bon, je vous délivre un passeport. Voilà. Au suivant!
Spaceport_Passport_PayNoMesetas = Vous n'avez pas assez d'argent. Revenez plus tard.
Spaceport_Shuttle = C'est un vol direct pour Motavia. Vous embarquez?

Spaceport_People_Cop_Closed = Accès refusé. Les voyages spatiaux sont désormais interdits à tous les citoyens. C'est une question de sécurité nationale.
Spaceport_People_Cop_TakePassport = Nous devons confisquer votre passeport.


# Paseo Spaceport
Paseo_Spaceport_Ent1 = Voici le port spatial de Paseo, le seul de Motavia.
Paseo_Spaceport_Ent2 = C'est la saison de reproduction des fourmilions, soyez prudents.
Paseo_Spaceport_Ent3 = Il paraît qu'il y a une pâtisserie dans la grotte de Naula, sur Palma. Je me demande si elle a des clients, dans une grotte pareille.
Paseo_Spaceport_Shuttle = Cette navette part pour Palma. Vous embarquez?

# Paseo
Paseo_House_1 = Voici Paseo, la capitale de Motavia.
Paseo_House_2 = On ne peut pas traverser les fourmilions à pied.
Paseo_House_3 = Le Gouverneur adore les sucreries.
Paseo_People_Ent1 = La grotte de Mahal se trouve dans les montagnes au nord de Paseo.
Paseo_People_Ent2 = Il existe des monstres intelligents, mais ils parlent une autre langue que la nôtre. Il faudrait être magicien pour les comprendre.
Paseo_People_Ent3 = Pour rencontrer le Gouverneur, il faut présenter un cadeau.
Paseo_People_Ent4 = Même le Gouverneur est en mauvais termes avec LaShiec.
Paseo_People_Cop_Exit = Vous feriez mieux de ne pas quitter la zone résidentielle.
Paseo_People_Cop_Passage = zzz...
Paseo_Shop_Myau = Vous avez déjà vu un chat qui parle? Rare. Très rare. Unique en son genre, si je ne m'abuse. Un million de mesetas et il est à vous. Alors?
Paseo_Shop_MyauYes = Vous n'avez pas assez de mesetas!
Paseo_Shop_MyauNo = Dommage. ...Attendez voir. C'est un pot laconien, ça? Et si on faisait un échange : le pot contre le minou?
Paseo_Shop_MyauTradeYes = Ça me fait de la peine de voir partir le petit, mais je ne peux pas refuser un tel échange. Prenez bien soin de lui.
Paseo_Shop_MyauTradeNo = Quoi, sérieusement? Hé, où allez-vous?
Paseo_Shop_MyauAfter = J'ai fait fortune en vendant ce pot laconien! Merci!
Paseo_People_Cop_No_Pass = Désolé, nous sommes en alerte maximale. Un laissez-passer signé est exigé pour accéder au port spatial. Accès refusé.
Paseo_People_Cop_Pass = Accès autorisé. Passez.

Paseo_Passageway_Cop = Halte! Avez-vous apporté un cadeau pour le Gouverneur?
Paseo_Passageway_Cop_NoGiftYes = Ce ne sont pas des cadeaux convenables!
Paseo_Passageway_Cop_NoGiftNo = Je ne peux pas vous laisser entrer sans cadeau!
Paseo_Passageway_Cop_Gift = Ah, un gâteau. Il sera ravi. Je vous le garde. Passez.
Paseo_Governor_RestHouseBefore = Vous semblez fatigués. Pourquoi ne pas vous reposer ici un moment?
Paseo_Governor_RestHouseAfter = Bonne chance. Vous en aurez besoin.
Paseo_Governor_Intro = Vous comptez renverser LaShiec, n'est-ce pas? LaShiec est un homme puissant. Non, plus qu'un homme. Il est au-delà de ces limites. C'est tout autre chose. Vous êtes très courageux de l'affronter. Mais le courage, je le crains, ne suffira pas. Cependant, il y a quelque chose en vous, quelque chose de très puissant. C'est un pouvoir que vous devrez découvrir par vous-même. Je ne peux pas vous en dire plus. Pas encore. Allez. Détruisez-le. Je ne vous arrêterai pas. Je vais même vous aider. Un puissant Esper nommé Lutz vit dans la grotte de Mahal, au nord d'ici. Portez-lui cette lettre. Il comprendra. Revenez ici quand vous aurez vaincu LaShiec. J'ai foi en vous.
Paseo_Governor_Rest = Vous devez être fatigués par votre voyage. Pourquoi ne pas vous reposer ici un moment?
Paseo_Governor_Dream = Vous êtes tombés dans un profond sommeil...
Paseo_Governor_BadDream = Ce n'était qu'un rêve...
Paseo_Governor_Return = Il n'y a pas un instant à perdre. Soyez prudents. Je prie pour votre sécurité.
Paseo_Governor_Greet = Revenez ici quand vous aurez vaincu LaShiec. Que Dieu vous garde.
Paseo_Governor_Greet_BeforeLutz = Puisque les ordres viennent du Gouverneur, Lutz écoutera sans doute.


# Paseo/End
Paseo_Mansion_Darkfalz = Vide! Où est le Gouverneur?
Paseo_Governor_Darkfalz_Dead = Tiens donc. Vous êtes morts? Quel dommage. Ressuscitez et réessayez.
Paseo_Governor_Darkfalz = Oh, mon dieu. Mon esprit et mon corps étaient... possédés par une force maléfique. C'est un miracle que je sois encore en vie. Merci. Vous avez réussi. Vous avez sauvé Algol. L'histoire retiendra vos noms, à jamais.
Paseo_Governor_End = Alisa. Je dois vous dire quelque chose. C'est un secret que j'ai gardé pour protéger votre vie. Maintenant que LaShiec n'est plus, je peux le révéler. Alisa... votre père était le roi d'Algol. Son sang royal coule en vous. Il vous a donné votre force. Nous sommes sans dirigeant, Alisa. Voulez-vous succéder à votre père et devenir la reine d'Algol?
Paseo_Governor_EndYes = Bien! Vous êtes désormais la reine d'Algol.
Paseo_Governor_EndNo = Non? Très bien, si tel est votre désir. Vous serez toujours la bienvenue ici.
Paseo_Governor_EndOk = Votre père a été le meilleur roi qu'Algol ait connu. Et plus encore, c'était un homme bon. Il serait fier de vous aujourd'hui.


# Cinematic Display: Myau
Cinematic_Myau_1 = On dirait qu'on est compagnons maintenant, hein? Je suis Alisa. Comment t'appelles-tu?
Cinematic_Myau_2 = Myau.
Cinematic_Myau_3 = Bonjour, Myau. Je cherche un homme nommé Tylon. On raconte qu'il voyageait avec un animal parlant. Ce ne serait pas toi, par hasard?
Cinematic_Myau_4 = Tylon a été changé en pierre en essayant de tuer Medusa! On peut le guérir avec ce médicament, mais je n'arrive pas à ouvrir le flacon. Il doit toujours être dans la grotte au sud de Camineet, tu sais comment y aller?
Cinematic_Myau_5 = Je pense que oui. Viens, allons l'aider.

# Odin in Stone
Odin_Stone = On dirait que cette personne a été changée en pierre. Serait-ce Tylon?
Odin_Item_Alsulin = Alisa ouvrit le flacon et en versa le contenu.
Odin_Item_Myau = Mais Myau ne put ouvrir le flacon.

# Cinematic Display: Odin
Cinematic_Odin_1 = Ah, Myau, tu as trouvé de l'aide. Merci. Medusa était plus forte que je ne le pensais, je n'ai aucune chance contre LaShiec. Qui est ta nouvelle amie?
Cinematic_Odin_2 = Je m'appelle Alisa. Mon frère Nero a été assassiné en tentant de renverser LaShiec. Je vais le tuer. Nero m'a donné ton nom juste avant de mourir. Il a dit que tu m'aiderais.
Cinematic_Odin_3 = Je vois. Eh bien, je ne peux pas laisser une fille comme toi partir seule, pas vrai?
Cinematic_Odin_4 = Merci de t'inquiéter, mais je sais me défendre. Pourquoi t'en es-tu pris à Medusa?
Cinematic_Odin_5 = Medusa possède une hache légendaire, j'espérais y voir le sang de LaShiec. J'ai caché une boussole dans une impasse de cette grotte. Nous en aurons besoin. Allons-y.

# Eppi
Eppi_People_Ent1 = Bienvenue au village d'Eppi! Nous recevons peu de visiteurs ces derniers temps, depuis que la forêt grouille de monstres.
Eppi_House_1 = Ça ne m'étonnerait pas que le Gouverneur de Motavia approuve ce que vous faites.
Eppi_House_2 = Tous les grands Espers vivent sur Motavia.
Eppi_House_3 = Savez-vous quel est le matériau le plus dur et le plus résistant du monde?
Eppi_House_3_Yes = OK. Bonne journée.
Eppi_House_3_No = C'est le laconium! Les armes laconiennes sont les plus puissantes qui soient!
Eppi_House_4 = Il y a longtemps, un professeur nommé Luveno avait un laboratoire de recherche dans les bois de Gothic. Existe-t-il encore?
Eppi_House_Key = Alors comme ça, vous vous attaquez au vieux LaShiec? Soit vous êtes fous, soit vous êtes plus coriaces que vous n'en avez l'air. En tout cas, j'admire votre courage. Avez-vous besoin d'une clef de donjon?
Eppi_House_KeyNo = Bonne chance.
Eppi_House_KeyYes = J'en ai caché une dans l'entrepôt à la sortie de la zone résidentielle de Camineet. Elle est à vous.
Eppi_House_Key_Return = Vous aurez besoin de toute l'aide possible pour vaincre LaShiec.

# Naula Cave
Naula_CakeShop = Hé, bienvenue, content de vous voir. Désolé pour l'endroit. Avec toutes ces hausses d'impôts, c'est tout ce que je pouvais me permettre. Vous savez ce que c'est. Mes gâteaux mondialement célèbres coûtent 280 mesetas. Vous en voulez un?
Naula_CakeShopNo = Bon, revenez quand vous voulez.
Naula_CakeShopYes = Merci! Revenez!

# Iala Cave
Iala_Man = J'ai vu beaucoup d'hommes entrer dans la chambre intérieure. En sortir, par contre, c'est une autre histoire. Je n'ai jamais vu personne en ressortir vivant.

# Maharu Cave
Maharu_Noah_NoLetter = Qui êtes-vous? J'essaie de m'entraîner. Ne me dérangez pas.

Cinematic_Noah_1 = Vous devez être Lutz. J'ai une lettre du Gouverneur pour vous. Voulez-vous la lire?
Cinematic_Noah_2 = Montrez-moi ça. ...Ah. Je vois. Nous en sommes donc là. Pardonnez mon hostilité de tout à l'heure. LaShiec est un homme dangereux. Pour le bien d'Algol, il doit être arrêté. Je crois pouvoir aider. Il faut prévenir le Dr Luveno, dans les bois de Gothic. Si je me souviens bien, on peut y accéder par une bouche d'égout à la station spatiale de Camineet. Allons-y. Vite.

# Manhole Passage
Spaceport_Passage_Assistant = Ne me déconcentrez pas! Je suis très occupé.
Spaceport_Passage_Assistant_pos_Luveno = Quoi? Vous avez fait évader le Doc? Quoi?! Il vous construit un vaisseau spatial?! Il est trop vieux pour ça. Je ferais mieux d'aller l'aider.

# Gothic
Gothic_People_Ent1 = Un PelorieMate me ferait vraiment du bien. Vous pouvez m'en donner un?
Gothic_People_Ent1No = Alors je ne vous aiderai pas. Fichez le camp.
Gothic_People_Ent1Yes = Merci. Je suppose que vous cherchez le Doc Luveno. Oui, son labo était ici. Plus maintenant. Ils ont fini par enfermer ce cinglé. Il est détenu à Triada, une prison au sud d'ici.
Gothic_People_EntNotEnoughCola = J'ai l'air d'un idiot?!
Gothic_People_Ent2 = Un PelorieMate me ferait vraiment du bien. Vous pouvez m'en donner un?
Gothic_People_Ent2No = Alors je ne vous aiderai pas. Fichez le camp.
Gothic_People_Ent2Yes = Merci, étranger. Au bout du sentier qui mène dans les montagnes se dresse une tour ancienne. On raconte que la vieille Medusa s'y cache. A moins de vouloir finir en statue, restez-en éloignés.
Gothic_People_Ent3 = Hé! Restez hors de mon territoire!
Gothic_People_Ent3_hapsby = Je suppose que je dois obéir au Dr Luveno. Passez.
Gothic_House_Luveno = Salutations. Qu'est-ce qui vous a pris si longtemps? Commençons. D'abord, allez chercher mon assistant. Il se cache probablement dans le passage souterrain. Un peu paranoïaque, celui-là.
Gothic_House_Luveno_pos_Assistant = Bien. Mon équipe est au complet. Quoi, vous ne croyez pas que deux personnes peuvent construire un vaisseau spatial? Sachez que j'en construis depuis que vous portiez des couches! Bon. Acheter un vaisseau spatial, ce n'est pas comme acheter un PelorieMate. C'est un investissement sérieux, et cela coûte de l'argent, beaucoup. J'exige 1200 mesetas d'avance. Vous pouvez payer?
Gothic_House_Luveno_fee_No = Si vous ne faites pas ce que je dis, je ne peux pas vous aider.
Gothic_House_Luveno_fee_Yes = Magnifique. Nous commençons la construction immédiatement. Cela prendra du temps, je suis un peu rouillé. Allez donc tuer quelques gelées, ou ce que vous faites d'habitude.
